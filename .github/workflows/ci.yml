name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # `check` is lint + tsc + api-surface drift. All three run before the build on
      # purpose: `next build` does typecheck, but only after a full production compile,
      # so a missing import in a docs page survived every quick local gate until CI.
      - run: bun run check
      - run: bun run build
