name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # One command that is the real gate: lint, then build (which runs check:api and
      # typechecks). `bun run typecheck` alone cannot be the gate — Next's global types
      # come from the gitignored next-env.d.ts, which only a build generates.
      - run: bun run check
